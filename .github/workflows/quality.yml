name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Application quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check structure
        run: npm run check:structure

      - name: Check migrations
        run: npm run check:migrations

      - name: Check forbidden patterns
        run: npm run check:forbidden

      - name: Check CSS tokens
        run: npm run check:css-tokens

      - name: Check dead code
        run: npm run check:dead-code

      - name: Check V1 feature coverage
        run: npm run check:feature-coverage

      - name: Check formatting
        id: formatting
        continue-on-error: true
        run: |
          set +e
          npm run format:check
          exit_code=$?
          echo "exitCode=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Prepare formatting failure patch
        if: steps.formatting.outputs.exitCode != '0'
        run: |
          npm run format
          git diff --binary > formatting.patch

      - name: Upload formatting failure patch
        if: steps.formatting.outputs.exitCode != '0'
        uses: actions/upload-artifact@v4
        with:
          name: formatting-failure-patch
          path: formatting.patch
          if-no-files-found: error
          retention-days: 3

      - name: Confirm formatting
        if: steps.formatting.outputs.exitCode != '0'
        run: exit 1

      - name: Lint
        run: npm run lint

      - name: Check native contracts
        run: npm run check:native-schemas

      - name: Check release metadata
        run: npm run check:release-metadata

      - name: Check core content
        run: npm run check:core-content

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: |
          set +e
          npm run typecheck > typecheck.log 2>&1
          exit_code=$?
          cat typecheck.log
          echo "exitCode=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload typecheck failure log
        if: steps.typecheck.outputs.exitCode != '0'
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-failure-log
          path: typecheck.log
          if-no-files-found: error
          retention-days: 3

      - name: Confirm typecheck
        if: steps.typecheck.outputs.exitCode != '0'
        run: exit 1

      - name: Run tests
        run: npm run test

      - name: Check performance budgets
        run: npm run test:performance

      - name: Build
        run: npm run build

      - name: Check bundle budgets
        run: npm run check:bundle

  browser-tests:
    name: Browser workflows
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Run Playwright flows in Microsoft Edge
        run: npm run test:e2e

  native-quality:
    name: Native quality
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Rust formatting
        id: rustfmt
        continue-on-error: true
        shell: bash
        run: |
          set +e
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all -- --check
          exit_code=$?
          echo "exitCode=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Prepare Rust formatting failure patch
        if: steps.rustfmt.outputs.exitCode != '0'
        shell: bash
        run: |
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all
          git diff --binary > rustfmt.patch

      - name: Upload Rust formatting failure patch
        if: steps.rustfmt.outputs.exitCode != '0'
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-failure-patch
          path: rustfmt.patch
          if-no-files-found: error
          retention-days: 3

      - name: Confirm Rust formatting
        if: steps.rustfmt.outputs.exitCode != '0'
        run: exit 1

      - name: Run Clippy
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Run native tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --all-features
