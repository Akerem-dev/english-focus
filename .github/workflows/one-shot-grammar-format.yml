name: One-shot grammar formatter

on:
  push:
    branches:
      - feat/grammar-v12-figma-implementation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/grammar-v12-figma-implementation

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format curated grammar files
        run: >-
          npx prettier --write
          apps/desktop/src/modules/grammar/components/CuratedGrammarLesson.tsx
          apps/desktop/src/modules/grammar/knowledge/grammarTeachingContent.ts

      - name: Remove one-shot workflow and commit formatting
        shell: bash
        run: |
          git rm .github/workflows/one-shot-grammar-format.yml
          if git diff --quiet && git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src/modules/grammar/components/CuratedGrammarLesson.tsx
          git add apps/desktop/src/modules/grammar/knowledge/grammarTeachingContent.ts
          git commit -m "Format curated grammar lesson files"
          git push origin HEAD:feat/grammar-v12-figma-implementation
