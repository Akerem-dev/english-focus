name: One-shot library boundary repair

on:
  push:
    branches:
      - feat/grammar-engine-integration

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/grammar-engine-integration

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Move collections persistence behind provider boundary
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/desktop/src/modules/library/pages/LibraryPage.tsx';
          let source = fs.readFileSync(path, 'utf8');

          const oldProviders = `import {
            useFileTransfer,
            useToast,
            useVocabularyMetadata,
            useVocabularyRepository
          } from "../../../app/providers";`;
          const newProviders = `import {
            type PersistedCollection,
            useCollectionsRepository,
            useFileTransfer,
            useToast,
            useVocabularyMetadata,
            useVocabularyRepository
          } from "../../../app/providers";`;
          const oldInfrastructure = `import {
            TauriCollectionsRepository,
            type PersistedCollection
          } from "../../../infrastructure/persistence";\n`;
          const oldRepository = `  const collectionsRepository = useMemo(() => new TauriCollectionsRepository(), []);`;
          const newRepository = `  const collectionsRepository = useCollectionsRepository();`;

          for (const [label, needle] of [
            ['provider import', oldProviders],
            ['infrastructure import', oldInfrastructure],
            ['repository construction', oldRepository]
          ]) {
            if (!source.includes(needle)) {
              throw new Error(`Expected ${label} was not found; refusing a partial repair.`);
            }
          }

          source = source
            .replace(oldProviders, newProviders)
            .replace(oldInfrastructure, '')
            .replace(oldRepository, newRepository);

          fs.writeFileSync(path, source);
          NODE
          npx prettier --write apps/desktop/src/modules/library/pages/LibraryPage.tsx

      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Boundary repair already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src/modules/library/pages/LibraryPage.tsx
          git commit -m "fix(library): route persistence through provider"
          git push origin HEAD:feat/grammar-engine-integration
