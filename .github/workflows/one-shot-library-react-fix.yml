name: One-shot library React fix

on:
  push:
    branches:
      - feat/grammar-engine-integration

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/grammar-engine-integration

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repair modal synchronization and search labels
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('apps/desktop/src/modules/library/pages/LibraryPage.tsx')
          source = path.read_text(encoding='utf-8')

          pattern = re.compile(
              r'''  useEffect\(\(\) => \{\n'''
              r'''    if \(modal === null\) \{\n      return;\n    \}\n\n'''
              r'''    setModalQuery\(""\);.*?'''
              r'''\n  \}, \[activeCollection, modal\]\);''',
              re.DOTALL,
          )
          replacement = '''  useEffect(() => {
            if (modal === null) {
              return;
            }

            let cancelled = false;
            queueMicrotask(() => {
              if (cancelled) {
                return;
              }

              setModalQuery("");
              setModalWordSelection([]);
              setMoveTargetId(undefined);

              if (modal.type === "new") {
                setDraftTitle("");
                setDraftDescription("");
                setDraftTone("gold");
                setDraftCoverPreset("ridge");
                setDraftCoverImage(undefined);
                return;
              }

              if (modal.type === "edit" && activeCollection !== undefined) {
                setDraftTitle(activeCollection.title);
                setDraftDescription(activeCollection.description);
                setDraftTone(activeCollection.tone);
                setDraftCoverPreset(activeCollection.coverPreset);
                setDraftCoverImage(activeCollection.coverImage);
              }
            });

            return () => {
              cancelled = true;
            };
          }, [activeCollection, modal]);'''

          source, count = pattern.subn(replacement, source, count=1)
          if count != 1:
              raise SystemExit(f'Expected one modal effect replacement, got {count}.')

          detail = '              <input\n                onChange={(event) => setWordQuery(event.currentTarget.value)}'
          detail_new = '              <input\n                aria-label="Search words in collection"\n                onChange={(event) => setWordQuery(event.currentTarget.value)}'
          overview = '            <input\n              onChange={(event) => setCollectionQuery(event.currentTarget.value)}'
          overview_new = '            <input\n              aria-label="Search collections"\n              onChange={(event) => setCollectionQuery(event.currentTarget.value)}'

          if detail not in source or overview not in source:
              raise SystemExit('Expected search input anchors were not found.')

          source = source.replace(detail, detail_new, 1).replace(overview, overview_new, 1)
          path.write_text(source, encoding='utf-8')
          PY
          npx prettier --write apps/desktop/src/modules/library/pages/LibraryPage.tsx

      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo "React repair already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src/modules/library/pages/LibraryPage.tsx
          git commit -m "fix(library): avoid synchronous effect state resets"
          git push origin HEAD:feat/grammar-engine-integration
