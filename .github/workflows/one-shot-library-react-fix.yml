name: One-shot library React fix

on:
  push:
    branches:
      - feat/grammar-engine-integration

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/grammar-engine-integration

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repair modal synchronization and search labels
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/desktop/src/modules/library/pages/LibraryPage.tsx';
          let source = fs.readFileSync(path, 'utf8');

          const oldEffect = `  useEffect(() => {
            if (modal === null) {
              return;
            }

            setModalQuery("");
            setModalWordSelection([]);
            setMoveTargetId(undefined);

            if (modal.type === "new") {
              setDraftTitle("");
              setDraftDescription("");
              setDraftTone("gold");
              setDraftCoverPreset("ridge");
              setDraftCoverImage(undefined);
              return;
            }

            if (modal.type === "edit" && activeCollection !== undefined) {
              setDraftTitle(activeCollection.title);
              setDraftDescription(activeCollection.description);
              setDraftTone(activeCollection.tone);
              setDraftCoverPreset(activeCollection.coverPreset);
              setDraftCoverImage(activeCollection.coverImage);
            }
          }, [activeCollection, modal]);`;

          const newEffect = `  useEffect(() => {
            if (modal === null) {
              return;
            }

            let cancelled = false;
            queueMicrotask(() => {
              if (cancelled) {
                return;
              }

              setModalQuery("");
              setModalWordSelection([]);
              setMoveTargetId(undefined);

              if (modal.type === "new") {
                setDraftTitle("");
                setDraftDescription("");
                setDraftTone("gold");
                setDraftCoverPreset("ridge");
                setDraftCoverImage(undefined);
                return;
              }

              if (modal.type === "edit" && activeCollection !== undefined) {
                setDraftTitle(activeCollection.title);
                setDraftDescription(activeCollection.description);
                setDraftTone(activeCollection.tone);
                setDraftCoverPreset(activeCollection.coverPreset);
                setDraftCoverImage(activeCollection.coverImage);
              }
            });

            return () => {
              cancelled = true;
            };
          }, [activeCollection, modal]);`;

          if (!source.includes(oldEffect)) {
            throw new Error('Expected modal synchronization effect was not found.');
          }
          source = source.replace(oldEffect, newEffect);

          const detailNeedle = `              <input
                onChange={(event) => setWordQuery(event.currentTarget.value)}
                placeholder="Find a word in this collection…"`;
          const detailReplacement = `              <input
                aria-label="Search words in collection"
                onChange={(event) => setWordQuery(event.currentTarget.value)}
                placeholder="Find a word in this collection…"`;
          const overviewNeedle = `            <input
              onChange={(event) => setCollectionQuery(event.currentTarget.value)}
              placeholder="Search collections…"`;
          const overviewReplacement = `            <input
              aria-label="Search collections"
              onChange={(event) => setCollectionQuery(event.currentTarget.value)}
              placeholder="Search collections…"`;

          if (!source.includes(detailNeedle) || !source.includes(overviewNeedle)) {
            throw new Error('Expected collection search inputs were not found.');
          }
          source = source
            .replace(detailNeedle, detailReplacement)
            .replace(overviewNeedle, overviewReplacement);

          fs.writeFileSync(path, source);
          NODE
          npx prettier --write apps/desktop/src/modules/library/pages/LibraryPage.tsx

      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo "React repair already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src/modules/library/pages/LibraryPage.tsx
          git commit -m "fix(library): avoid synchronous effect state resets"
          git push origin HEAD:feat/grammar-engine-integration
