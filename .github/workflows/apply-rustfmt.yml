name: Apply Rustfmt Once

on:
  push:
    branches: [feat/assistant-launcher-shell]

permissions:
  contents: write

concurrency:
  group: apply-rustfmt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rustfmt:
    runs-on: ubuntu-latest

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/assistant-launcher-shell

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply Rust formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all

      - name: Commit formatting changes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src-tauri
          git commit -m "style: apply rustfmt to Gemini routing"
          git push origin HEAD:feat/assistant-launcher-shell
