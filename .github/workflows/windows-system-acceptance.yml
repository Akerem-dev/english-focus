name: Windows System Acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows-system-acceptance.yml"
      - "apps/desktop/**"
      - "packages/**"
      - "scripts/**"
      - "testing/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: windows-system-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-system:
    name: MSI and NSIS system acceptance
    runs-on: windows-latest
    timeout-minutes: 75

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install locked dependencies
        run: npm ci

      - name: Validate Windows acceptance script syntax
        shell: powershell
        run: |
          $evidenceRoot = "test-results/windows-system"
          New-Item -ItemType Directory -Force -Path $evidenceRoot | Out-Null
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/test-windows-system.ps1").Path,
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object {
              [pscustomobject]@{
                Message = $_.Message
                ErrorId = $_.ErrorId
                Line = $_.Extent.StartLineNumber
                Column = $_.Extent.StartColumnNumber
                Text = $_.Extent.Text
              }
            } | Format-List | Out-File "$evidenceRoot/parser-errors.txt" -Encoding utf8
            Get-Content "$evidenceRoot/parser-errors.txt"
            exit 1
          }

      - name: Build and verify fresh installers
        shell: powershell
        timeout-minutes: 30
        run: |
          $evidenceRoot = "test-results/windows-system"
          New-Item -ItemType Directory -Force -Path $evidenceRoot | Out-Null
          $stdoutPath = Join-Path $evidenceRoot "installer-build.stdout.log"
          $stderrPath = Join-Path $evidenceRoot "installer-build.stderr.log"
          $npm = (Get-Command npm.cmd).Source
          $process = Start-Process -FilePath $npm `
            -ArgumentList @("run", "release:windows:unsigned") `
            -Wait -PassThru -NoNewWindow `
            -RedirectStandardOutput $stdoutPath `
            -RedirectStandardError $stderrPath
          Get-Content $stdoutPath -ErrorAction SilentlyContinue
          Get-Content $stderrPath -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) {
            exit $process.ExitCode
          }

      - name: Install pinned WinApp CLI
        run: npm install --no-save --package-lock=false @microsoft/winappcli@0.3.1

      - name: Run Windows system acceptance
        shell: powershell
        timeout-minutes: 25
        run: |
          $evidenceRoot = "test-results/windows-system"
          New-Item -ItemType Directory -Force -Path $evidenceRoot | Out-Null
          $stdoutPath = Join-Path $evidenceRoot "system-acceptance.stdout.log"
          $stderrPath = Join-Path $evidenceRoot "system-acceptance.stderr.log"
          $npm = (Get-Command npm.cmd).Source
          $process = Start-Process -FilePath $npm `
            -ArgumentList @("run", "test:windows:system", "--", "-SkipBuild", "-LeaveUninstalled") `
            -Wait -PassThru -NoNewWindow `
            -RedirectStandardOutput $stdoutPath `
            -RedirectStandardError $stderrPath
          Get-Content $stdoutPath -ErrorAction SilentlyContinue
          Get-Content $stderrPath -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) {
            exit $process.ExitCode
          }

      - name: Upload system acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-system-acceptance
          path: test-results/windows-system/**
          if-no-files-found: error
          retention-days: 14
