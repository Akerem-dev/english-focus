name: Windows System Acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows-system-acceptance.yml"
      - "apps/desktop/**"
      - "packages/**"
      - "scripts/**"
      - "testing/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: windows-system-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-system:
    name: MSI and NSIS system acceptance
    runs-on: windows-latest
    timeout-minutes: 75

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install locked dependencies
        run: npm ci

      - name: Run Windows system acceptance
        shell: powershell
        run: npm run test:windows:system -- -LeaveUninstalled

      - name: Upload system acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-system-acceptance
          path: test-results/windows-system/**
          if-no-files-found: warn
          retention-days: 14
