name: Collections backup/reset integration

on:
  push:
    branches: [feat/search-visual-cleanroom]
    paths:
      - .github/workflows/collections-backup-reset-integration.yml
      - scripts/integrate-collections-backup-reset.py

permissions:
  contents: write

jobs:
  integrate:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: feat/search-visual-cleanroom
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply Collections integration
        run: python scripts/integrate-collections-backup-reset.py

      - name: Install dependencies
        run: npm ci

      - name: Generate native schemas
        run: npm run generate:native-schemas

      - name: Format
        run: |
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all
          npx prettier --write packages/domain/src/backup/BackupDescriptor.ts packages/domain/src/data/LocalDataReset.ts packages/schemas/src/backup/backup-manifest.schema.ts packages/schemas/src/data/local-data.schema.ts apps/desktop/src/infrastructure/persistence/TauriLocalDataRepository.ts apps/desktop/src/modules/settings/application/ManageLocalData.ts apps/desktop/src/modules/settings/components/LocalDataControlsSection.tsx packages/schemas/tests/local-data.schema.test.ts apps/desktop/tests/unit/settings/local-data-management.test.ts testing/contracts/native-boundary-fixtures.json

      - name: Check migrations
        run: npm run check:migrations

      - name: Check native schemas
        run: npm run check:native-schemas

      - name: Typecheck
        run: npm run typecheck

      - name: Run schema tests
        run: npm run test --workspace=@platform/schemas

      - name: Run local-data tests
        run: npx vitest run apps/desktop/tests/unit/settings/local-data-management.test.ts

      - name: Native compile check
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets

      - name: Native tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib

      - name: Diff sanity
        shell: bash
        run: git diff --check

      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src-tauri/src/commands/collections.rs \
                  apps/desktop/src-tauri/src/commands/backup.rs \
                  apps/desktop/src-tauri/src/commands/data_reset.rs \
                  packages/domain/src/backup/BackupDescriptor.ts \
                  packages/domain/src/data/LocalDataReset.ts \
                  packages/schemas/src/backup/backup-manifest.schema.ts \
                  packages/schemas/src/data/local-data.schema.ts \
                  apps/desktop/src/infrastructure/persistence/TauriLocalDataRepository.ts \
                  apps/desktop/src/modules/settings/application/ManageLocalData.ts \
                  apps/desktop/src/modules/settings/components/LocalDataControlsSection.tsx \
                  apps/desktop/src-tauri/schemas \
                  testing/contracts/native-boundary-fixtures.json \
                  packages/schemas/tests/local-data.schema.test.ts \
                  apps/desktop/tests/unit/settings/local-data-management.test.ts
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat(collections): include collections in backup and reset"
          git push origin HEAD:feat/search-visual-cleanroom
